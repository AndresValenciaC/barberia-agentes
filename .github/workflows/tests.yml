name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite dispararlo manualmente desde GitHub, con o sin smoke

jobs:
  tests-deterministas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Correr tests (sin smoke - no necesita API key)
        run: pytest -m "not smoke"

  smoke-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'   # solo corre si lo disparas manualmente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Correr smoke tests (API real)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m smoke